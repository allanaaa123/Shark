
name: Build Android APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare boss textures
        run: |
          python3 -m pip install --quiet Pillow numpy scipy
          python3 tools/prepare_boss_poses.py tools/boss_sources/dunk.png tools/boss_sources/grouper.png tools/boss_sources/squid.png --preview app/build/reports/ui-preview/05-boss-designs.png
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for name in ['dunkleosteus','giant_grouper','giant_squid']:
              p=Path('app/src/main/assets/shark')/name/'swim_atlas.webp'
              print('BOSS_TEXTURE:'+name+':'+base64.b64encode(p.read_bytes()).decode())
          PY

      - name: Check transparent species assets
        run: |
          python3 -m pip install --quiet Pillow
          python3 tools/check_species_assets.py

      - name: Build APK
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SharkOverlay-APK
          path: app/build/outputs/apk/debug/*.apk


      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OceanUI-Previews
          path: app/build/reports/ui-preview/*.png
          if-no-files-found: ignore

